version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fuzurra_postgres
    restart: always
    environment:
      POSTGRES_USER: fuzurra_admin
      POSTGRES_PASSWORD: fuzurra_secure_password_2026
      POSTGRES_DB: fuzurra_erp_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzurra_admin -d fuzurra_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fuzurra_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuzurra_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://fuzurra_admin:fuzurra_secure_password_2026@postgres:5432/fuzurra_erp_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: fuzurra_prod_secret_token_signature_key
      JWT_EXPIRES_IN: 7d
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuzurra_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
